
name: LOGISTEC - Generar APK Android

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Compilar LOGISTEC Mobile
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Reconstruir carpetas LOGISTEC
        run: python RECONSTRUIR_LOGISTEC.py

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Configurar Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Preparar Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Instalar Android API 36
        run: |
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: Instalar TypeScript y preparar aplicación
        working-directory: mobile
        run: |
          npm install --save-dev typescript@^5.9.3
          npm run build

      - name: Generar proyecto Android y sincronizar Capacitor
        run: |
          bash mobile/scripts/CONFIGURAR_ANDROID_CI.sh

      - name: Verificar Gradle
        run: |
          test -f mobile/android/gradlew
          chmod +x mobile/android/gradlew

      - name: Compilar APK
        working-directory: mobile/android
        run: |
          ./gradlew --no-daemon :app:assembleDebug --stacktrace

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: LOGISTEC-Mobile-APK
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
